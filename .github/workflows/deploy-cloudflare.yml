# Builds the portal and deploys it to Cloudflare Workers (OpenNext) on each
# push to main.
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers")
#   Variables: CLOUDFLARE_ACCOUNT_ID, and the public values baked into the
#              pages at build time: NEXT_PUBLIC_SUPABASE_URL,
#              NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (or _ANON_KEY),
#              NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_APP_NAME (optional)
# Runtime secrets (SUPABASE_SECRET_KEY, RESEND_API_KEY, WEBSITE_API_KEY, ...)
# are set on the Worker in the Cloudflare dashboard; deploys keep them.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the Cloudflare token is set
        id: setup
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set yet; nothing to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.setup.outputs.ready == 'true'

      - name: Build and deploy
        if: steps.setup.outputs.ready == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
